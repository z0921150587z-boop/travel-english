name: Keep Supabase awake
# 免費版 Supabase 連續 7 天資料庫活動太少就會自動休眠。
# 這個排程每 2 天對資料庫發幾個真實查詢，讓它永遠不會進入休眠。
# 同時提交一個時間戳檔案 —— GitHub 會在 repo 連續 60 天沒有活動時停用排程工作流程，
# 每次執行都留下一次 commit 就不會被停用。
on:
  schedule:
    - cron: '23 19 */2 * *'   # 每 2 天一次（UTC 19:23 ≒ 台灣 03:23）
  workflow_dispatch:           # 也可以到 Actions 分頁手動按一次
permissions:
  contents: write
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 讀取 config.js 裡的 Supabase 設定
        id: cfg
        run: |
          URL=$(grep -o 'SUPABASE_URL:"[^"]*"' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'SUPABASE_ANON_KEY:"[^"]*"' config.js | cut -d'"' -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::在 config.js 找不到 SUPABASE_URL 或 SUPABASE_ANON_KEY"; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: 對資料庫發送查詢（這就是 Supabase 認定的「活動」）
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          fail=0
          for path in "profiles?select=id&limit=1" "progress?select=user_id&limit=1" "events?select=id&limit=1"; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 30 \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/$path" || echo 000)
            echo "查詢 ${path%%\?*} → HTTP $code"
            # 200/206 = 正常；401/403 = RLS 擋住匿名讀取，但請求有打到資料庫，一樣算活動
            case "$code" in 200|206|401|403|404) ;; *) fail=1 ;; esac
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" "$URL/auth/v1/health" || echo 000)
          echo "Auth health → HTTP $code"
          if [ "$fail" = "1" ]; then
            echo "::warning::資料庫沒有正常回應，專案可能已經休眠，需要到 Supabase 後台按 Resume project"
          fi

      - name: 留下時間戳，避免 GitHub 因 repo 閒置停用排程
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ  keepalive ping sent' > .github/last-keepalive.txt
          git config user.name  "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: supabase keepalive $(date -u '+%Y-%m-%d')" || { echo "沒有變更"; exit 0; }
          git pull --rebase --autostash || true
          git push
