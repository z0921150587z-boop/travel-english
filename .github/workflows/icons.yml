name: Generate app icons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Draw icons
        run: |
          mkdir -p icons
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import random
          def icon(size, maskable, name):
              im=Image.new('RGB',(size,size),'#0B1026'); d=ImageDraw.Draw(im)
              for y in range(size):
                  t=y/size; d.line([(0,y),(size,y)],fill=(int(11+17*t),int(16+26*t),int(38+56*t)))
              cx,cy=size*0.5,size*0.52; R=size*0.25 if maskable else size*0.3
              d.ellipse([cx-R,cy-R,cx+R,cy+R],fill='#F5C451'); s=R
              d.polygon([(cx-s*0.9,cy+s*0.15),(cx+s*0.95,cy-s*0.55),(cx+s*0.1,cy+s*0.75)],fill='#0B1026')
              d.polygon([(cx-s*0.9,cy+s*0.15),(cx+s*0.95,cy-s*0.55),(cx-s*0.05,cy+s*0.2)],fill='#1C2A5E')
              random.seed(3)
              for _ in range(18):
                  x=random.random()*size;y=random.random()*size*0.6;rr=max(1,size*0.008)
                  if (x-cx)**2+(y-cy)**2>R*R*1.3: d.ellipse([x-rr,y-rr,x+rr,y+rr],fill='white')
              im.save(name)
          icon(192,False,'icons/icon-192.png'); icon(512,False,'icons/icon-512.png'); icon(512,True,'icons/icon-512-maskable.png')
          EOF
      - name: Commit icons
        run: |
          git config user.name "icon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icons
          git commit -m "Add app icons" || echo "no change"
          git push
